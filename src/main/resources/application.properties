# Production Database configuration
hibernate.connection.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
hibernate.connection.username=${POSTGRES_USER:postgres}
hibernate.connection.password=${POSTGRES_PASSWORD:qwerty}
hibernate.connection.driver_class=org.postgresql.Driver
#hibernate.connection.driver_class=com.p6spy.engine.spy.P6SpyDriver
hibernate.show_sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect